<!doctype html><html lang="en"><meta charset="utf-8"><title>Synthetic Shorts overlay regression</title>
<style>
html{font:16px system-ui;background:#fff;color:#111}body{margin:0}button{font:inherit;background:#fafafa;color:#111;border:1px solid #777;border-radius:6px;padding:8px}header{height:58px;background:#fff;position:relative;z-index:1;padding:0 18px;display:flex;align-items:center;gap:14px}ytd-guide-renderer{display:none;position:fixed;left:0;top:58px;bottom:0;width:200px;background:#eee;padding:12px;box-sizing:border-box}html.sidebar ytd-guide-renderer{display:block}ytd-shorts{display:block;position:absolute;inset:70px 28px 28px}html.sidebar ytd-shorts{left:228px}ytd-reel-video-renderer{display:block;position:absolute;inset:0;background:#fff}ytd-reel-video-renderer[hidden]{display:none}.player{width:300px;height:calc(100% - 90px);position:absolute;left:50%;top:25px;transform:translateX(-50%)}video{width:100%;height:100%;object-fit:contain}.caption-window{position:absolute;left:20px;top:26px;background:#111;color:#fff;padding:8px;border-radius:4px}#cinematic-container{position:absolute;inset:0;background:transparent}#overlay,yt-reel-player-overlay-view-model{display:block;position:absolute;inset:0;pointer-events:none;background:transparent}#overlay button{pointer-events:auto}#metadata{position:absolute;left:30px;right:30px;bottom:25px;background:transparent}#title{display:inline-block;max-width:250px}#actions{position:absolute;left:calc(50% + 175px);top:32%;background:transparent;display:grid;gap:8px}.badge{position:absolute;left:calc(50% - 260px);top:32%;display:inline-block;padding:7px;background:#eee}.badge::before{content:"LIVE"}#sticker-layer{position:absolute;left:calc(50% - 260px);top:46%;background:linear-gradient(90deg,#e6e6e6,#bababa);padding:10px;max-width:100px}#local-icon{position:absolute;left:calc(50% - 230px);top:20%;width:28px;height:28px}#comments{position:fixed;right:0;top:60px;width:240px;height:calc(100vh - 90px);background:#eee;border:1px solid #777;padding:14px;box-sizing:border-box;z-index:3}#comments[hidden]{display:none}html.dark{background:#111;color:#fff}html.dark header,html.dark ytd-reel-video-renderer{background:#111}html.dark ytd-guide-renderer,html.dark #comments{background:#222;color:#fff}ytd-reel-video-renderer:fullscreen{inset:0;width:100vw;height:100vh;background:inherit}ytd-reel-video-renderer:fullscreen .player{height:calc(100% - 90px)}#fullscreen{position:absolute;right:30px;bottom:25px}html.short-title #title{max-width:130px}
</style><body><header><strong>Synthetic overlay fixture</strong><button onclick="fixture.go(1-fixture.index)">Next</button><button onclick="fixture.comments()">Comments</button></header><ytd-guide-renderer>Original fixture sidebar</ytd-guide-renderer><ytd-shorts></ytd-shorts><ytd-engagement-panel-section-list-renderer id="comments" hidden>Original fixture comments<br><button onclick="fixture.comments()">Close</button></ytd-engagement-panel-section-list-renderer>
<script>
const ids=['aaaaaaaaaaa','bbbbbbbbbbb'];document.querySelector('ytd-shorts').innerHTML=ids.map((id,i)=>`<ytd-reel-video-renderer video-id="${id}" ${i?'hidden':''}><div id="cinematic-container"></div><div id="shorts-player" class="player html5-video-player"><a class="ytp-title-link" href="/shorts/${id}" hidden>Video ID</a><video class="html5-main-video" src="/demo/assets/portrait.webm" muted loop></video><div class="caption-window">Original caption</div></div><div id="overlay"><yt-reel-player-overlay-view-model><div id="metadata"><span id="title">Original multiline title for local protection ${i+1}</span></div><div id="actions"><button onclick="fixture.clicks++">Like</button><button onclick="fixture.comments()">Comments</button></div><span class="badge"></span><div id="sticker-layer">Gradient card</div><svg id="local-icon" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#e94575"/></svg><button id="fullscreen" onclick="fixture.full()">Fullscreen</button></yt-reel-player-overlay-view-model></div></ytd-reel-video-renderer>`).join('');
window.fixture={index:0,clicks:0,go(i){this.index=i;document.querySelectorAll('ytd-reel-video-renderer').forEach((r,n)=>r.hidden=n!==i);history.pushState({},'', '/shorts/'+ids[i]);document.dispatchEvent(new Event('yt-page-data-updated'));},comments(){document.querySelector('#comments').hidden=!document.querySelector('#comments').hidden},full(){document.fullscreenElement?document.exitFullscreen():document.querySelector('ytd-reel-video-renderer:not([hidden])').requestFullscreen()},theme(dark){document.documentElement.classList.toggle('dark',dark)},sidebar(show){document.documentElement.classList.toggle('sidebar',show)}};
document.querySelectorAll('video').forEach(v=>v.play());
</script></body></html>
