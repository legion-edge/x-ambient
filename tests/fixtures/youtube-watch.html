<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>YouTube watch fixture — original local media</title>
<style>
html{background:#101014;color:#eee;font:16px system-ui}body{margin:0}header{padding:20px;position:sticky;top:0;background:#181820;z-index:2}button{padding:10px;margin:4px}ytd-watch-flexy{display:block;padding:28px}ytd-watch-flexy[hidden]{display:none}#movie_player{position:relative;width:min(760px,80vw);margin:auto}video{display:block;width:100%;height:auto}#controls{position:absolute;bottom:0;left:0;background:#222b;padding:8px}#cinematics{height:32px;background:#ff00aa;position:absolute;top:-24px;width:100%}ytd-watch-flexy[theater] #movie_player{width:100%;max-width:1100px}aside{margin:50px}aside video{width:220px}footer{height:1000px;padding:40px}#ad{display:none}.ad-showing #ad{display:block;position:absolute;top:20px;left:20px;background:orange;color:black;padding:30px}
#movie_player:fullscreen{width:100vw;height:100vh;max-width:none;padding:0;margin:0;background:black}#movie_player:fullscreen video{width:100%;height:100%;object-fit:contain}#movie_player:fullscreen #cinematics{top:0}#caption{position:absolute;left:36%;top:12px;background:#111;color:white;padding:8px;z-index:2}#fs-exit{position:absolute;right:12px;bottom:12px;z-index:2}#fs-exit{display:none}#movie_player:fullscreen #fs-exit{display:block}
</style></head>
<body><header><b>YouTube watch fixture</b><button id="theater">Theater</button><button id="advert">Ad</button><button id="seek">Seek</button><button id="fullscreen">Fullscreen</button><button id="home">Home</button><button id="next">Next video</button></header>
<ytd-watch-flexy video-id="aaaaaaaaaaa"><div id="movie_player"><div id="cinematics">Native ambient fixture</div><video class="html5-main-video" src="/demo/assets/aurora.webm" muted loop controls preload="auto"></video><button id="controls">Click-through</button><div id="caption" class="caption-window">Protected caption</div><button id="fs-exit">Exit fullscreen</button><div id="ad">Ad fixture</div></div><h1>Original local aurora</h1><p>Watch page and theater layout. No YouTube scripts or user data.</p></ytd-watch-flexy>
<aside><b>Recommendation (must never be selected)</b><video src="/demo/assets/portrait.webm" muted loop autoplay></video></aside><footer>Scroll test</footer>
<script>
window.fixture={clicks:0,go(path,id,finish=true){document.dispatchEvent(new Event('yt-navigate-start'));history.pushState({},'',path);const w=document.querySelector('ytd-watch-flexy');w.hidden=!path.startsWith('/watch?');if(id)w.setAttribute('video-id',id);if(finish)document.dispatchEvent(new Event('yt-navigate-finish'));},finish(id){document.querySelector('ytd-watch-flexy').setAttribute('video-id',id);document.dispatchEvent(new Event('yt-navigate-finish'));}};
const player=document.querySelector('#movie_player'),watch=document.querySelector('ytd-watch-flexy'),video=player.querySelector('video');
document.querySelector('#theater').onclick=()=>watch.toggleAttribute('theater');document.querySelector('#advert').onclick=()=>player.classList.toggle('ad-showing');document.querySelector('#controls').onclick=()=>fixture.clicks++;document.querySelector('#seek').onclick=()=>{video.pause();video.currentTime=video.currentTime>1?0.2:1.2};document.querySelector('#fullscreen').onclick=()=>player.requestFullscreen();document.querySelector('#fs-exit').onclick=()=>document.exitFullscreen();document.querySelector('#home').onclick=()=>fixture.go('/');document.querySelector('#next').onclick=()=>fixture.go('/watch?v=bbbbbbbbbbb','bbbbbbbbbbb');
addEventListener('popstate',()=>{const id=new URLSearchParams(location.search).get('v');watch.hidden=location.pathname!='/watch';if(id)watch.setAttribute('video-id',id);document.dispatchEvent(new Event('yt-navigate-finish'));});
</script></body></html>
