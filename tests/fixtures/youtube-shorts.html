<!doctype html><html lang="en"><meta charset="utf-8"><title>Original local Shorts fixture</title><style>
html{background:#101014;color:white;font:16px system-ui}body{margin:0}header{height:50px;display:flex;align-items:center}button{padding:8px}ytd-shorts{display:block;height:calc(100vh - 50px);overflow-y:scroll;scroll-snap-type:y mandatory}ytd-reel-video-renderer{display:block;height:calc(100vh - 50px);scroll-snap-align:start;position:relative}ytd-reel-video-renderer[hidden]{display:none}.player{height:100%;width:320px;max-width:65vw;position:relative;margin:auto}video{width:100%;height:100%;object-fit:contain}#cinematic-container{position:absolute;inset:0;background:#333}#actions{position:absolute;left:calc(50% + 175px);top:25%;background:#171717}#metadata{position:absolute;left:16px;bottom:25px;background:#181818;padding:12px}.caption-window{position:absolute;top:25px;left:25px;background:#111;padding:8px}#comments{position:fixed;right:0;top:60px;width:220px;height:80vh;background:#222;z-index:5}#comments[hidden]{display:none}
</style><body><header><button onclick="fixture.go(0)">First</button><button onclick="fixture.go(1)">Next</button><button onclick="fixture.watch()">Watch</button><button onclick="document.querySelector('#comments').hidden=!document.querySelector('#comments').hidden">Comments</button></header><ytd-shorts></ytd-shorts><ytd-engagement-panel-section-list-renderer id="comments" hidden>Protected comments</ytd-engagement-panel-section-list-renderer>
<script>
const ids=['aaaaaaaaaaa','bbbbbbbbbbb','ccccccccccc'];const scroller=document.querySelector('ytd-shorts');
scroller.innerHTML=ids.map((id,i)=>`<ytd-reel-video-renderer video-id="${id}"><div id="cinematic-container">Native ambient</div><div id="shorts-player" class="player html5-video-player"><a class="ytp-title-link" href="/shorts/${id}" hidden>Title</a><video class="html5-main-video" src="/demo/assets/${i%2?'aurora':'portrait'}.webm" muted loop preload="auto"></video><div class="caption-window">Caption</div></div><div id="metadata">Short ${i+1}</div><div id="actions"><button onclick="fixture.clicks++">Like</button></div></ytd-reel-video-renderer>`).join('');
const watch=document.createElement('ytd-watch-flexy');watch.hidden=true;watch.setAttribute('video-id',ids[0]);watch.innerHTML='<div id="movie_player" style="width:600px;max-width:90vw;margin:auto"><div id="cinematics">Watch native ambient</div><video class="html5-main-video" src="/demo/assets/aurora.webm" muted loop style="height:auto"></video></div>';document.body.append(watch);
window.fixture={clicks:0,index:0,go(i,route=true){this.index=i;watch.hidden=true;scroller.hidden=false;scroller.style.display='block';if(route)history.pushState({},'', '/shorts/'+ids[i]);scroller.scrollTop=i*scroller.clientHeight;document.dispatchEvent(new Event('yt-page-data-updated'));},watch(){document.dispatchEvent(new Event('yt-navigate-start'));history.pushState({},'','/watch?v='+ids[0]);scroller.style.display='none';watch.hidden=false;document.dispatchEvent(new Event('yt-navigate-finish'));}};scroller.addEventListener('scroll',()=>{const i=Math.round(scroller.scrollTop/scroller.clientHeight);if(i!==fixture.index){fixture.index=i;history.replaceState({},'','/shorts/'+ids[i]);document.dispatchEvent(new Event('yt-page-data-updated'));}});fixture.go(0,false);document.querySelectorAll('video').forEach(v=>v.play());
</script></body></html>
