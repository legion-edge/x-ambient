<!doctype html><html><head><meta charset="utf-8"><title>Original local embed fixture</title><style>
html,body{margin:0;width:100%;height:100%;background:black;color:white}#movie_player{position:relative;width:100vw;height:100vh;background:black}video{display:block;width:100%;height:100%;object-fit:contain}.ytmVideoInfoVideoTitle{position:absolute;left:20px;top:10px;background:#111;color:white;padding:8px}.caption-window{position:absolute;left:35%;bottom:16px;background:#111;padding:8px}.ytp-chrome-bottom{position:absolute;right:12px;bottom:12px;background:#111;padding:8px}button{padding:8px}#menu{position:absolute;right:20px;top:25px;width:150px;height:100px;background:#ddd;color:#111}#menu[hidden]{display:none}#movie_player:fullscreen{width:100vw;height:100vh}
</style></head><body><div id="movie_player"><video class="html5-main-video" src="/demo/assets/portrait.webm" muted loop autoplay></video><a class="ytmVideoInfoVideoTitle" href="https://www.youtube.com/watch?v=aaaaaaaaaaa">Original local video</a><div class="caption-window">Protected caption</div><div class="ytp-chrome-bottom"><button id="control">Control</button><button id="fullscreen">Fullscreen / exit</button></div><div id="menu" role="menu" hidden>Protected menu</div></div><script>
window.fixture={clicks:0};document.querySelector('#control').onclick=()=>fixture.clicks++;document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.querySelector('#movie_player').requestFullscreen().catch(e=>fixture.fullscreenError=e.name+':'+e.message);
</script></body></html>
